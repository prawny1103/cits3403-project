<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Room</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body>
    <main id="multichoice-question">
        <div class="container mt-5">
            <div class="border border-dark border-4 rounded-5 overflow-hidden shadow">

                <div class="bg-blue p-4 d-flex justify-content-between align-items-center border-bottom border-dark border-4 landing-text">
                    <h1>Agile Quiz</h1>
                    <div>
                        {% if current_user %}
                            <span class="me-3">Signed in as {{ current_user.username }}</span>
                            <a class="btn btn-outline-light btn-sm" href="/profile">Profile</a>
                            <a class="btn btn-outline-light btn-sm" href="/logout">Sign Out</a>
                        {% else %}
                            <a class="btn btn-outline-light btn-sm me-2" href="/login">Sign In</a>
                            <a class="btn btn-outline-light btn-sm" href="/register">Register</a>
                        {% endif %}
                    </div>
                </div>

                <div class="bg-white p-5 text-center" style="min-height: 550px;">
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10">
                            <div class="card border-0 shadow-sm">
                                <div class="card-body text-start">
                                    <h2 class="card-title fw-bold text-center mb-4">Host a Room</h2>
                                    <p class="text-muted text-center mb-5">Choose your quiz settings and invite players with a room code.</p>

                                    <form>
                                        <div class="row g-4">
                                            <div class="col-12">
                                                <div class="card p-4 border border-dark rounded-4">
                                                    <h5 class="fw-bold mb-3">Quiz type</h5>
                                                    <div class="form-check mb-2">
                                                        <input class="form-check-input" type="radio" name="quizType" id="randomQuiz" checked>
                                                        <label class="form-check-label" for="randomQuiz">Random quiz</label>
                                                    </div>
                                                    <div class="form-check mb-3">
                                                        <input class="form-check-input" type="radio" name="quizType" id="presetQuiz">
                                                        <label class="form-check-label" for="presetQuiz">Preset quiz</label>
                                                    </div>

                                                    <div id="preset-options" class="mt-3" style="display:none;">
                                                        <label class="form-label fw-bold">Choose preset quiz</label>
                                                        <select id="preset-select" class="form-select rounded-pill px-4 py-3 border border-primary" aria-label="Preset quiz selector">
                                                            <option selected>Select a preset quiz</option>
                                                            <option value="general">General knowledge</option>
                                                            <option value="science">Science and nature</option>
                                                            <option value="history">History</option>
                                                            <option value="sports">Sports</option>
                                                        </select>
                                                    </div>

                                                    <div id="random-settings" class="row g-3 mt-4">
                                                        <div class="col-md-6">
                                                            <div>
                                                                <label class="form-label fw-bold">Number of questions</label>
                                                                <select id="question-count" class="form-select rounded-pill px-4 py-3 border border-primary" aria-label="Number of questions">
                                                                    <option selected>10</option>
                                                                    <option value="5">5</option>
                                                                    <option value="10">10</option>
                                                                    <option value="15">15</option>
                                                                    <option value="20">20</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                        <div class="col-md-6">
                                                            <div>
                                                                <label class="form-label fw-bold">Difficulty</label>
                                                                <select id="difficulty" class="form-select rounded-pill px-4 py-3 border border-primary" aria-label="Difficulty">
                                                                    <option selected>Any</option>
                                                                    <option value="easy">Easy</option>
                                                                    <option value="medium">Medium</option>
                                                                    <option value="hard">Hard</option>
                                                                </select>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="col-12">
                                                <div class="card p-4 border border-dark rounded-4">
                                                    <h5 class="fw-bold mb-3">Timer</h5>
                                                    <div class="row gy-3">
                                                        <div class="col-4">
                                                            <button type="button" class="btn btn-blue rounded-pill w-100 px-4 py-3 border border-dark border-2">15 sec</button>
                                                        </div>
                                                        <div class="col-4">
                                                            <button type="button" class="btn btn-blue rounded-pill w-100 px-4 py-3 border border-dark border-2">30 sec</button>
                                                        </div>
                                                        <div class="col-4">
                                                            <button type="button" class="btn btn-blue rounded-pill w-100 px-4 py-3 border border-dark border-2">45 sec</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="col-12 text-center mt-4">
                                                <button type="button" class="btn btn-blue rounded-pill px-5 py-3 fw-bold border border-dark border-2">HOST ROOM</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const randomRadio = document.getElementById('randomQuiz');
        const presetRadio = document.getElementById('presetQuiz');
        const presetOptions = document.getElementById('preset-options');
        const randomSettings = document.getElementById('random-settings');

        function updatePresetVisibility() {
            const isPreset = presetRadio.checked;
            presetOptions.style.display = isPreset ? 'block' : 'none';
            randomSettings.style.display = isPreset ? 'none' : 'flex';
        }

        randomRadio.addEventListener('change', updatePresetVisibility);
        presetRadio.addEventListener('change', updatePresetVisibility);

        updatePresetVisibility();
    </script>
</body>
</html>
