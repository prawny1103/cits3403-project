<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Agile Quiz</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../static/css/styles.css">
        <script src="../static/js/question.js"></script>
    </head>

    <body>
        <main id="multichoice-question">
            <div class="container mt-5">
                <div class="border border-dark border-4 rounded-5 overflow-hidden shadow">

                <div class="bg-blue p-4 d-flex justify-content-center align-items-center border-bottom border-dark border-4 landing-text">
                    <h1>Agile Quiz</h1>
                </div>

                <div class="d-flex justify-content-center align-items-center bg-white p-5">
                    <div id="question-block" class="rounded-5">
                        <p id="question-text" question-id="{{ question-id }}">{{ question }}</p>
                    </div>
                </div>

                <div id="answer-multi">
                    <button class="choice-btn rounded-pill" ans-choice="A">A</button>
                    <button class="choice-btn rounded-pill" ans-choice="B">B</button>
                    <button class="choice-btn rounded-pill" ans-choice="C">C</button>
                    <button class="choice-btn rounded-pill" ans-choice="D">D</button>
                </div>

            </div>
        </main>
    </body>
</html>
