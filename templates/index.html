<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Agile Quiz</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../static/css/styles.css">
    <style>
       
    </style>
    </head>

    <body>
        <main id="landing-page">
        <div class="container mt-5">

            <div class="border border-dark border-4 rounded-5 overflow-hidden shadow">

                <div class="bg-blue p-4 d-flex justify-content-between align-items-center border-bottom border-dark border-4 landing-text">
                    <h1>Agile Quiz</h1>
                    <div class="small-text">
                        {% if current_user %}
                            <h3>Welcome, {{ current_user.username }}</h3>
                            <h3><a href="/profile">Profile</a></h3>
                            <h3><a href="/logout">Sign Out</a></h3>
                        {% else %}
                            <h3><a href="/login">Sign In</a></h3>
                            <h3><a href="/register">Register</a></h3>
                        {% endif %}
                    </div>
                    
                </div>

                <div class="bg-white p-5 text-center" style="min-height: 450px;">
                    <div class="row">
                        <div class="col-8 text-center">
                            <h1 class="display-2 fw-bold landing-text">Welcome to</h1>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-4"></div><div class="col-8 text-center">
                            <h1 class="display-1 fw-bold landing-text">Agile Quiz</h1>
                        </div>
                    </div>
                
                <div class="d-flex justify-content-center gap-5 mt-4">
                    <button id="create-room-button" type="button" class="btn btn-blue rounded-pill px-5 py-3 fw-bold border border-dark border-2">Create Room</button>
                    <button id="join-room-button" type="button" class="btn btn-blue rounded-pill px-5 py-3 fw-bold border border-dark border-2">Join Room</button>
                </div>
                <div id="login-alert" class="alert alert-warning mt-4 mx-auto" role="alert" style="max-width: 400px;">
                    Please login to create a room
                </div>
            </div>
        </div>
        </main>
    <script>
        const createRoomButton = document.getElementById('create-room-button');
        const joinRoomButton = document.getElementById('join-room-button');
        const loginAlert = document.getElementById('login-alert');
        const isLoggedIn = {{ (current_user is not none) | tojson }};
        let alertTimeout;

        function hideLoginAlert() {
            loginAlert.classList.remove('visible');
            alertTimeout = window.setTimeout(() => {
                loginAlert.style.display = 'none';
            }, 250);
        }

        function showLoginAlert() {
            if (alertTimeout) {
                window.clearTimeout(alertTimeout);
            }

            loginAlert.style.display = 'block';
            loginAlert.classList.remove('visible');
            void loginAlert.offsetWidth;
            loginAlert.classList.add('visible');

            alertTimeout = window.setTimeout(hideLoginAlert, 2000);
        }

        createRoomButton.addEventListener('click', () => {
            if (isLoggedIn) {
                window.location.href = '/create-room';
                return;
            }
            loginAlert.textContent = 'Please login to create a room';
            showLoginAlert();
        });

        joinRoomButton.addEventListener('click', () => {
            if (isLoggedIn) {
                window.location.href = '/join-room';
                return;
            }
            loginAlert.textContent = 'Please login to join a room';
            showLoginAlert();
        });
    </script>
</body>
</html>
</body>

</html>
