<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/minecraft-logo.svg')}}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main id="signup-page" class="d-flex align-items-center justify-content-center">
        <section class="signup-block shadow">
            <div class="signup-wrapper">
            <p class="signup-join-name">Join agileGroup</p>
            <p class="signup-create-your-account-head">Create your account</p>

                <form method="POST" action="{{url_for('auth.signup')}}">
                    <div class="signup-form-group">
                        <label for="signup-username">Username <span>*</span></label>
                        <input type="text"
                               id="signup-username" 
                               class="form-control" 
                               name="username" 
                               placeholder="JohnDoe123"
                               minlength="3"
                               required 
                               >
                    </div>
                    
                    <div class="signup-form-group">
                        <label for="signup-password">Password <span>*</span></label>
                        <input type="password" class="form-control" id="signup-password" name="password" required placeholder="Enter Password">
                    </div>
                    
                    <div class="signup-form-group">
                        <label for="signup-password-confirm"> Confirm Password <span>*</span></label>
                        <input type="password" id="signup-password-confirm"  class="form-control" name="confirm_password" required placeholder="Confirm Password">
                    </div>

                    <div class="signup-message-area">
                        <!-- Re-check this -->
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                <div class="signup-login-flash" id="signup-flash">
                                    {{ messages[0] }}
                                </div>
                            {% endif %}
                                <p id="signup-criteria" class="signup-password-criteria {% if messages %} hidden {% endif %}">Password must be at least 5 characters including ONE number and ONE uppercase character. </p>
                        {% endwith %}
                    </div>
                    <button id="signup-button" class="btn" type="submit">Join Now</button>
                </form>
                
                <p class="signup-already-got-account-text" >
                    Already have an account? 
                    <a class="signup-to-login-link" href="{{ url_for('auth.login') }}">Log in here</a>
                </p>
                
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        const flash = document.getElementById('signup-flash')
        const criteria = document.getElementById('signup-criteria')

        if (flash) {
            setTimeout(() => {
                flash.classList.add('fade-out');
                
                    setTimeout(() => {
                        flash.remove();
                        criteria.classList.remove('hidden')
                    }, 500);

                }, 5000);
            }

    </script>

</body>
</html>
