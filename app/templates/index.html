<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Agile Quiz</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/minecraft-logo.svg')}}">
    </head>

    <body id="landing-body">
        <header class="landing-header d-flex align-items-center justify-content-between">
            <nav class="d-flex align-items-center justify-content-between">

                <a href="" class="login-nav-left-container d-flex justify-content-center align-items-center">
                    <img class="me-3 pb-1" src="{{ url_for('static', filename='images/minecraft-logo.svg') }}" alt="app-logo">
                    <h1 class="fw-bold m-0">AGILE QUIZ</h1>
                </a>

                <div class="login-nav-right-container d-flex justify-content-between align-items-center text-end">
                        {% if current_user.is_authenticated %}
                            <h3 class="login-nav-authenticated-username m-0"> {{ current_user.username }} </h3>
                            <a class="login-nav-authenticated-logout" href="{{ url_for('auth.logout') }}">Log Out</a>
                        {% else %}
                            <a class="login-nav-not-authenticated" href="{{ url_for('auth.login') }}">LOGIN</a>
                            <a class="login-nav-not-authenticated" href="{{ url_for('auth.signup') }}">REGISTER</a>
                        {% endif %}
                </div>

            </nav>
        </header>
        
        <main id="landing-page-main" class="d-flex justify-content-center align-items-center">
            <div class="landing-container d-flex justify-content-center align-items-start">
                <div class="landing-inner-container-width d-flex flex-column justify-content-center align-items-center">

                    <div class="landing-inner2-container-top d-flex justify-content-between align-items-end">
                        <div class="landing-inner3-container-left d-flex flex-column align-items-start">
                            <h1 class="welcome-text-body">Welcome to</h1>
                            <h1 class="game-name-body fw-bold">AGILE QUIZ</h1>
                        </div>
                        <div class="landing-inner3-container-right d-flex flex-column justify-content-around align-items-end">
                            <button id="create-room-btn" type="button" class="btn">Create Room</button>
                            <button id="join-room-btn" type="button" class="btn">Join Room</button>
                        </div>
                    </div>

                    <div class="landing-inner2-container-bottom d-flex align-items-center justify-content-center mt-3">
                        <div id="login-alert" class="alert alert-warning mt-3" role="alert">
                            Please log in to create or join a room.
                        </div>
                    </div>

                </div>                
            </div>
        </main>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var isLoggedIn = {{ current_user.is_authenticated|tojson }};
                var createRoomBtn = document.getElementById('create-room-btn');
                var joinRoomBtn = document.getElementById('join-room-btn');
                var loginAlert = document.getElementById('login-alert');

                if (!isLoggedIn && createRoomBtn && joinRoomBtn && loginAlert) {
                    createRoomBtn.addEventListener('click', function (e) {
                        e.preventDefault();
                        loginAlert.innerText = 'Please log in to create a room.';
                        loginAlert.classList.add('visible');
                    });
                    joinRoomBtn.addEventListener('click', function (e) {
                        e.preventDefault();
                        loginAlert.innerText = 'Please log in to join a room.';
                        loginAlert.classList.add('visible');
                    });
                } else if (isLoggedIn) {
                    if (createRoomBtn) {
                        createRoomBtn.addEventListener('click', function () {
                            window.location.href = "{{ url_for('main.create_room') }}";
                            return;
                        });
                    }
                    if (joinRoomBtn) {
                        joinRoomBtn.addEventListener('click', function () {
                            window.location.href = "{{ url_for('main.join_room') }}";
                            return;
                        });
                    }
                }
                
            });
        </script>
    </body>

</html>
