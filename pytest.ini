[pytest]
filterwarnings =
    # Ignore the datetime.utcnow() deprecation warning from SQLAlchemy/Python 3.14
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    
    # Ignore the legacy Query.get() warning from SQLAlchemy 2.0
    ignore:The Query.get\(\) method is considered legacy:sqlalchemy.exc.LegacyAPIWarning