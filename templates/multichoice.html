<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Agile Quiz</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../static/css/styles.css">
        <script src="../static/js/question.js" defer></script>
    </head>

    <body>
        <main id="multichoice-question">
            <div class="container mt-5">
                <div class="border border-dark border-4 rounded-5 overflow-hidden shadow">

                <div class="bg-blue p-4 d-flex justify-content-between align-items-center border-bottom border-dark border-4 landing-text">
                    <h1>Agile Quiz</h1>
                    <div>
                        {% if current_user %}
                            <span class="me-3">Signed in as {{ current_user.username }}</span>
                            <a class="btn btn-outline-light btn-sm" href="/profile">Profile</a>
                            <a class="btn btn-outline-light btn-sm" href="/logout">Sign Out</a>
                        {% else %}
                            <a class="btn btn-outline-light btn-sm me-2" href="/login">Sign In</a>
                            <a class="btn btn-outline-light btn-sm" href="/register">Register</a>
                        {% endif %}
                    </div>
                </div>

                <div class="d-flex justify-content-center align-items-center bg-white p-5">
                    <div class="text-center">
                        <div id="score-display" class="mb-3 fw-bold fs-4">Score: 0 / 0</div>
                        <div id="question-block" class="rounded-5">
                            <p id="question-text" question-id="{{ question_id }}">{{ question }}</p>
                        </div>
                    </div>
                </div>

                <div id="answer-multi">
                    {% for key, value in choices.items() %}
                    <button class="choice-btn rounded-pill" ans-choice="{{ key }}">{{ value }}</button>
                    {% endfor %}
                </div>

            </div>
        </main>
    </body>
</html>
