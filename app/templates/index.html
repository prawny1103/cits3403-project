<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Agile Quiz</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>

    <body>
        <main id="landing-page">
        <div class="container mt-5">

            <div class="border border-dark border-4 rounded-5 overflow-hidden shadow">

                <div class="bg-blue p-4 d-flex justify-content-between align-items-center border-bottom border-dark border-4 landing-text">
                    <h1>Agile Quiz</h1>
                    <div class="small-text text-end">
                        {% if current_user.is_authenticated %}
                            <h3>Signed in as {{ current_user.username }}</h3>
                            <h3><a href="{{ url_for('auth.logout') }}">Log Out</a></h3>
                        {% else %}
                            <h3><a href="{{ url_for('auth.login') }}">Sign In</a></h3>
                            <h3><a href="{{ url_for('auth.signup') }}">Register</a></h3>
                        {% endif %}
                    </div>
                </div>

                <div class="bg-white p-5 text-center" style="min-height: 450px;">
                    <div class="row">
                        <div class="col-8 text-center">
                            <h1 class="display-2 fw-bold landing-text">Welcome to</h1>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-4"></div><div class="col-8 text-center">
                            <h1 class="display-1 fw-bold landing-text">Agile Quiz</h1>
                        </div>
                    </div>
                
                <div class="d-flex justify-content-center gap-5 mt-4">
                    <button id="create-room-btn" type="button" class="btn btn-blue rounded-pill px-5 py-3 fw-bold border border-dark border-2">Create Room</button>
                    <button id="join-room-btn" type="button" class="btn btn-blue rounded-pill px-5 py-3 fw-bold border border-dark border-2">Join Room</button>
                </div>

                <div id="login-alert" class="alert alert-warning mt-3" role="alert">
                    Please log in to create or join a room.
                </div>
            </div>
        </div>
        </main>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                var isLoggedIn = {{ current_user.is_authenticated|tojson }};
                var createRoomBtn = document.getElementById('create-room-btn');
                var joinRoomBtn = document.getElementById('join-room-btn');
                var loginAlert = document.getElementById('login-alert');

                if (!isLoggedIn && createRoomBtn && joinRoomBtn && loginAlert) {
                    createRoomBtn.addEventListener('click', function (e) {
                        e.preventDefault();
                        loginAlert.innerText = 'Please log in to create a room.';
                        loginAlert.classList.add('visible');
                    });
                    joinRoomBtn.addEventListener('click', function (e) {
                        e.preventDefault();
                        loginAlert.innerText = 'Please log in to join a room.';
                        loginAlert.classList.add('visible');
                    });
                } else if (isLoggedIn) {
                    if (createRoomBtn) {
                        createRoomBtn.addEventListener('click', function () {
                            window.location.href = "{{ url_for('main.create_room') }}";
                            return;
                        });
                    }
                    if (joinRoomBtn) {
                        joinRoomBtn.addEventListener('click', function () {
                            window.location.href = "{{ url_for('main.join_room') }}";
                            return;
                        });
                    }
                }
                
            });
        </script>
    </body>

</html>
