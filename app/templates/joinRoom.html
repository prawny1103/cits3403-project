<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Room</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/minecraft-logo.svg')}}">
</head>

<body>

    <main id="joinRoom-page">
        <header class="landing-header d-flex align-items-center justify-content-between">
            <nav class="d-flex align-items-center justify-content-between">
                
                <div class="joinRoom-nav-left-container d-flex justify-content-between align-items-center text-end ms-3">
                    <a href="{{ url_for('main.join_room') }}">JOIN ROOM</a>
                    <a href="{{ url_for('main.create_room') }}">CREATE ROOM</a>
                </div>
                
                <a href="{{ url_for('main.home') }}" class="joinRoom-nav-right-container d-flex justify-content-center align-items-center">
                    <h3 class="m-0"> {{ current_user.username }} </h3>
                </a>
            </nav>
        </header>

        
        <section id="joinRoom-body" class="d-flex justify-content-center align-items-center">
            <div class="joinRoom-container d-flex flex-column justify-content-around align-items-center">
                
                <div class="joinRoom-description d-flex flex-column justify-content-start align-items-center mt-5">
                    <h3>JOIN A ROOM</h3>
                    <p>Enter the 4-digit room code to join a quiz </p>

                    <form action="{{ url_for('quiz.join_game') }}" class="joinRoom-form d-flex flex-column justify-content-center align-items-center mt-3" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <label class="mt-3" for="room-code">ROOM CODE</label>
                        <input type="text" class="form-control fw-bold mt-2" name="room_code" id="room-code" placeholder="0000" maxlength="4" inputmode="numeric">
                        <button type="submit" class="btn mt-3 mb-5"> JOIN ROOM</button>
                        {% if error %}
                            <div class="alert alert-danger mt-2">{{ error }}</div>
                        {% endif %}
                    </form>
                </div>

                
            </div>
        </section>
    </main>
    <script>
        const roomCodeInput = document.getElementById('room-code');

        // Only allow numeric input
        roomCodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Auto-focus on first character, format display
        roomCodeInput.addEventListener('keypress', (e) => {
            if (roomCodeInput.value.length >= 4) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
